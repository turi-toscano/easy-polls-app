apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: results-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: results-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 18
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60 